<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Linux Remote</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0b0e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Linux Remote">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  :root {
    --bg: #0b0b0e;
    --bg-grad: radial-gradient(120% 90% at 50% 0%, #101014 0%, #0b0b0e 60%);
    --panel: #131318;
    --panel2: #1a1a21;
    --panel3: #22222b;
    --border: #26262f;
    --border-soft: #1e1e26;
    --text: #f0f0f5;
    --dim: #9a9aa8;
    --dimmer: #6b6b78;
    --accent: #4ade80;
    --accent-dark: #16a34a;
    --accent-glow: rgba(74, 222, 128, 0.22);
    --red: #f87171;
    --red-glow: rgba(248, 113, 113, 0.15);
    --amber: #fbbf24;
    --radius: 14px;
    --radius-sm: 10px;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    background: var(--bg-grad), var(--bg);
    background-attachment: fixed;
    color: var(--text);
    height: 100dvh;
    display: flex; flex-direction: column; overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* ---------- screen transitions ---------- */
  .screen {
    display: flex; flex: 1; flex-direction: column; min-height: 0;
    opacity: 0; visibility: hidden; pointer-events: none;
    position: absolute; inset: 0;
    transition: opacity 0.22s ease, visibility 0.22s, transform 0.22s ease;
    transform: translateY(8px);
  }
  .screen.active {
    opacity: 1; visibility: visible; pointer-events: auto;
    transform: translateY(0);
  }
  body { position: relative; }

  /* ---------- lock / setup screens ---------- */
  #screen-lock, #screen-setup {
    align-items: center; justify-content: center;
    padding: 24px 24px calc(24px + env(safe-area-inset-bottom));
    gap: 16px; text-align: center;
  }
  .locklogo {
    width: 76px; height: 76px; border-radius: 22px;
    background: linear-gradient(145deg, var(--panel3), var(--panel));
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 700; color: var(--accent);
    font-family: var(--mono);
    box-shadow: 0 0 40px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .locktitle { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
  .locksub {
    color: var(--dim); font-size: 14px; line-height: 1.65;
    max-width: 300px; min-height: 44px;
  }
  .locksub.err { color: var(--red); }

  /* ---------- polished PIN pad ---------- */
  .pindots { display: flex; gap: 14px; margin: 4px 0 8px; min-height: 20px; }
  .pindot {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--dimmer); background: transparent;
    transition: all 0.15s ease;
  }
  .pindot.filled {
    background: var(--accent); border-color: var(--accent);
    box-shadow: 0 0 10px var(--accent-glow);
    transform: scale(1.1);
  }
  .pinpad {
    display: grid; grid-template-columns: repeat(3, 80px); gap: 14px;
    justify-content: center;
  }
  .pinkey {
    width: 80px; height: 80px; border-radius: 50%;
    background: linear-gradient(145deg, var(--panel2), var(--panel));
    border: 1px solid var(--border);
    color: var(--text); font-size: 26px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-family: inherit; padding: 0; min-height: 0;
    transition: transform 0.1s ease, background 0.15s ease, box-shadow 0.15s ease;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .pinkey:active {
    background: var(--accent); border-color: var(--accent); color: #052e12;
    transform: scale(0.92);
    box-shadow: 0 0 24px var(--accent-glow);
  }
  .pinkey.util { font-size: 15px; color: var(--dim); font-weight: 700; letter-spacing: 0.5px; }
  .pinkey.util:active { color: #052e12; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
  }
  .shake { animation: shake 0.4s ease; }

  /* ---------- setup form ---------- */
  .setupform { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 12px; }
  .setupform input {
    width: 100%; background: var(--panel2); border: 1px solid var(--border);
    color: var(--text); border-radius: var(--radius-sm); padding: 14px;
    font-size: 16px; font-family: var(--mono);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .setupform input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .setupform label {
    text-align: left; font-size: 13px; color: var(--dim); font-weight: 600;
    display: block; margin-bottom: 6px;
  }
  .stepbadge {
    font-size: 11px; color: var(--accent); font-weight: 700;
    text-transform: uppercase; letter-spacing: 1.5px;
    background: var(--accent-glow); padding: 6px 14px; border-radius: 20px;
    border: 1px solid rgba(74, 222, 128, 0.25);
  }

  /* ---------- app topbar ---------- */
  #topbar {
    flex-shrink: 0; padding: 12px 14px calc(12px);
    border-bottom: 1px solid var(--border-soft);
    background: rgba(19, 19, 24, 0.92);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    display: flex; align-items: center; gap: 10px;
    padding-top: calc(12px + env(safe-area-inset-top));
  }
  #topbar .apptitle {
    display: flex; align-items: center; gap: 9px; flex: 1; min-width: 0;
  }
  #topbar .mini-logo {
    width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0;
    background: linear-gradient(145deg, var(--panel3), var(--panel));
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--accent);
  }
  #topbar h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.2px; white-space: nowrap; }

  /* connection status pill */
  #status {
    font-size: 12px; font-weight: 600; color: var(--dim);
    display: flex; align-items: center; gap: 7px;
    background: var(--panel2); border: 1px solid var(--border);
    padding: 7px 12px; border-radius: 20px;
    transition: all 0.2s ease; white-space: nowrap;
  }
  #status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dimmer); flex-shrink: 0; }
  #status.ok { color: var(--accent); border-color: rgba(74, 222, 128, 0.3); background: var(--accent-glow); }
  #status.ok .dot { background: var(--accent); animation: pulse 2s ease-in-out infinite; }
  #status.bad { color: var(--red); border-color: rgba(248, 113, 113, 0.3); background: var(--red-glow); }
  #status.bad .dot { background: var(--red); }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.5); }
    50% { box-shadow: 0 0 0 5px rgba(74, 222, 128, 0); }
  }
  #gearbtn {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 12px;
    color: var(--dim); font-size: 18px; width: 42px; height: 42px; min-height: 0;
    padding: 0; cursor: pointer; flex-shrink: 0;
    transition: all 0.15s ease;
  }
  #gearbtn:active { transform: scale(0.92); color: var(--text); border-color: var(--accent); }

  /* ---------- settings panel ---------- */
  #settings {
    flex-shrink: 0; padding: 14px; border-bottom: 1px solid var(--border-soft);
    background: var(--panel); display: flex; flex-direction: column; gap: 10px;
    max-height: 0; overflow: hidden; padding-top: 0; padding-bottom: 0;
    border-bottom-width: 0;
    transition: max-height 0.25s ease, padding 0.25s ease;
  }
  #settings.open { max-height: 260px; padding-top: 14px; padding-bottom: 14px; border-bottom-width: 1px; }
  .fieldrow { display: flex; gap: 8px; }
  .fieldrow input {
    flex: 1; min-width: 0; background: var(--panel2); border: 1px solid var(--border);
    color: var(--text); border-radius: var(--radius-sm); padding: 12px; font-size: 14px;
    font-family: var(--mono);
  }
  .fieldrow input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .btnrow { display: flex; gap: 8px; }

  /* ---------- buttons ---------- */
  button {
    font-family: inherit; cursor: pointer; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--panel2); color: var(--text);
    padding: 12px 18px; font-size: 15px; font-weight: 600; min-height: 48px;
    transition: transform 0.1s ease, background 0.15s ease;
  }
  button:active { transform: scale(0.97); }
  button.primary {
    background: linear-gradient(145deg, var(--accent), var(--accent-dark));
    border-color: transparent; color: #052e12; flex: 1;
    box-shadow: 0 4px 16px rgba(74, 222, 128, 0.25);
  }
  button.primary:active { box-shadow: 0 2px 8px rgba(74, 222, 128, 0.2); }
  button.danger { border-color: rgba(248, 113, 113, 0.4); color: var(--red); background: transparent; }
  button.ghost { background: transparent; }

  /* ---------- output area ---------- */
  #outputwrap { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }
  #outputbar {
    flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; border-bottom: 1px solid var(--border-soft);
  }
  #outputbar .label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1.2px; color: var(--dimmer);
  }
  #clearbtn {
    background: transparent; border: 1px solid var(--border);
    color: var(--dim); font-size: 12px; font-weight: 600;
    padding: 7px 14px; min-height: 0; border-radius: 8px;
  }
  #clearbtn:active { color: var(--red); border-color: var(--red); }
  #output {
    flex: 1; overflow-y: auto; padding: 14px;
    font-family: var(--mono); font-size: 13px; line-height: 1.6;
    white-space: pre-wrap; word-break: break-word;
    -webkit-overflow-scrolling: touch;
  }
  .entry {
    margin-bottom: 12px; background: var(--panel);
    border: 1px solid var(--border-soft); border-radius: var(--radius-sm);
    padding: 10px 12px; overflow: hidden;
    animation: fadein 0.2s ease;
  }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .entry .cmd { color: var(--accent); font-weight: 600; }
  .entry .cmd::before { content: "$ "; color: var(--dimmer); }
  .entry .out { color: #d4d4dc; margin-top: 6px; }
  .entry .err { color: var(--red); margin-top: 6px; }
  .entry .code {
    color: var(--dimmer); font-size: 11px; margin-top: 8px;
    padding-top: 6px; border-top: 1px solid var(--border-soft);
    font-family: var(--sans);
  }
  .entry .code.bad { color: var(--red); }
  .entry .code .okmark { color: var(--accent); }
  .hint {
    color: var(--dimmer); font-size: 13px; text-align: center;
    margin-top: 40px; line-height: 1.8; font-family: var(--sans);
    padding: 0 20px;
  }
  .hint .kbd {
    display: inline-block; background: var(--panel2); border: 1px solid var(--border);
    border-radius: 6px; padding: 1px 8px; font-family: var(--mono); font-size: 12px;
    color: var(--dim); margin: 0 2px;
  }

  /* ---------- quick commands ---------- */
  #quickbar {
    flex-shrink: 0; display: flex; gap: 8px; overflow-x: auto;
    padding: 10px 14px; border-top: 1px solid var(--border-soft);
    background: var(--panel);
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  #quickbar::-webkit-scrollbar { display: none; }
  .quickcmd {
    flex-shrink: 0; background: var(--panel2); border: 1px solid var(--border);
    color: var(--dim); font-family: var(--mono); font-size: 13px; font-weight: 500;
    padding: 9px 15px; min-height: 0; border-radius: 9px;
    transition: all 0.15s ease;
  }
  .quickcmd:active {
    color: #052e12; background: var(--accent); border-color: var(--accent);
    transform: scale(0.95);
  }

  /* ---------- composer ---------- */
  #composer {
    flex-shrink: 0; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border-soft); background: rgba(19, 19, 24, 0.95);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    display: flex; gap: 8px; align-items: center;
  }
  #cmd {
    flex: 1; min-width: 0; background: var(--panel2); border: 1px solid var(--border);
    color: var(--text); border-radius: 12px; padding: 13px 14px; font-size: 16px;
    font-family: var(--mono);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  #cmd:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  #send { min-width: 72px; flex-shrink: 0; }
  #send:disabled { opacity: 0.45; }
  .spinner {
    display: inline-block; width: 16px; height: 16px; flex-shrink: 0;
    border: 2px solid rgba(5, 46, 18, 0.3); border-top-color: #052e12;
    border-radius: 50%; animation: spin 0.7s linear infinite;
    vertical-align: -3px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- PIN LOCK -->
<div class="screen" id="screen-lock">
  <div class="locklogo">&gt;_</div>
  <div class="locktitle">Linux Remote</div>
  <div class="locksub" id="lockmsg">Enter your PIN to unlock.</div>
  <div class="pindots" id="pindots"></div>
  <div class="pinpad" id="pinpad"></div>
</div>

<!-- FIRST-RUN SETUP -->
<div class="screen" id="screen-setup">
  <div class="locklogo">&gt;_</div>
  <div class="stepbadge" id="setupstep">Step 1 of 2</div>
  <div class="locktitle" id="setuptitle">Set a PIN</div>
  <div class="locksub" id="setupmsg">Enter a 4 to 6 digit PIN. You will enter it every time you open the app.</div>
  <div class="pindots" id="setuppindots"></div>
  <div class="pinpad" id="setuppinpad"></div>
  <div class="setupform" id="setupform" style="display:none">
    <div>
      <label for="setup-url">Server URL</label>
      <input id="setup-url" type="url" placeholder="http://100.x.y.z:8000"
             autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <div>
      <label for="setup-key">API key</label>
      <input id="setup-key" type="password" placeholder="Paste the key from your server"
             autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <button class="primary" id="setupdone">Save and start</button>
  </div>
</div>

<!-- MAIN APP -->
<div class="screen" id="screen-app">
  <div id="topbar">
    <div class="apptitle">
      <div class="mini-logo">&gt;_</div>
      <h1>Linux Remote</h1>
    </div>
    <div id="status"><span class="dot"></span><span id="statustext">not tested</span></div>
    <button id="gearbtn" title="Settings" aria-label="Settings">&#9881;</button>
  </div>

  <div id="settings">
    <div class="fieldrow">
      <input id="url" type="url" placeholder="Server URL, e.g. http://100.x.y.z:8000"
             autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <div class="fieldrow">
      <input id="apikey" type="password" placeholder="API key"
             autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <div class="btnrow">
      <button class="primary" id="testbtn">Test connection</button>
      <button class="danger" id="lockbtn">Lock</button>
    </div>
  </div>

  <div id="outputwrap">
    <div id="outputbar">
      <span class="label">Output</span>
      <button id="clearbtn">Clear</button>
    </div>
    <div id="output">
      <div class="hint" id="hint">
        Run a command from below, or tap a shortcut.<br><br>
        <span class="kbd">&uarr;</span><span class="kbd">&darr;</span> cycle through history
      </div>
    </div>
  </div>

  <div id="quickbar" aria-label="Quick commands"></div>

  <div id="composer">
    <input id="cmd" type="text" placeholder="command..." autocomplete="off"
           autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send">
    <button id="send" class="primary">Run</button>
  </div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);

// ---------- crypto: SHA-256 hash of PIN, never stored raw ----------
async function sha256hex(text) {
  const buf = await crypto.subtle.digest("SHA-256",
    new TextEncoder().encode("lrpin:" + text));
  return Array.from(new Uint8Array(buf))
    .map(b => b.toString(16).padStart(2, "0")).join("");
}

// ---------- PIN pad builder ----------
function buildPinPad(padEl, dotsEl, maxLen, onComplete, onWrong) {
  let pin = "";
  const render = () => {
    dotsEl.innerHTML = "";
    for (let i = 0; i < maxLen; i++) {
      const d = document.createElement("div");
      d.className = "pindot" + (i < pin.length ? " filled" : "");
      dotsEl.appendChild(d);
    }
  };
  const keys = ["1","2","3","4","5","6","7","8","9","","0","bk"];
  padEl.innerHTML = "";
  keys.forEach(k => {
    const b = document.createElement("button");
    b.type = "button";
    if (k === "") { b.className = "pinkey spacer"; b.style.visibility = "hidden"; b.tabIndex = -1; }
    else if (k === "bk") { b.className = "pinkey util"; b.innerHTML = "&#9003;"; }
    else { b.className = "pinkey"; b.textContent = k; }
    if (k !== "") {
      b.onclick = () => {
        if (k === "bk") { pin = pin.slice(0, -1); }
        else if (pin.length < maxLen) {
          pin += k;
          if (pin.length === maxLen) {
            render();
            const done = pin; pin = "";
            setTimeout(() => { render(); onComplete(done); }, 120);
            return;
          }
        }
        render();
      };
    }
    padEl.appendChild(b);
  });
  render();
  return {
    reset() { pin = ""; render(); },
    shake() {
      padEl.classList.remove("shake");
      void padEl.offsetWidth;
      padEl.classList.add("shake");
    }
  };
}

// ---------- screens ----------
const screens = ["screen-lock", "screen-setup", "screen-app"];
function show(name) {
  screens.forEach(s => $(s).classList.toggle("active", s === name));
}

// ---------- setup flow ----------
let firstPin = null;
let setupStage = "pin"; // pin -> confirm -> details

function runSetup() {
  show("screen-setup");
  $("setupstep").textContent = "Step 1 of 2";
  $("setuptitle").textContent = "Set a PIN";
  $("setupmsg").textContent = "Enter a 4 to 6 digit PIN. You will enter it every time you open the app.";
  $("setupmsg").classList.remove("err");
  $("setupform").style.display = "none";
  $("setuppinpad").style.display = "";
  $("setuppindots").style.display = "";
  setupStage = "pin";
  let setupPad;
  setupPad = buildPinPad($("setuppinpad"), $("setuppindots"), 6, pin => {
    if (pin.length < 4) {
      $("setupmsg").textContent = "PIN must be at least 4 digits. Try again.";
      $("setupmsg").classList.add("err");
      setupPad.shake();
      return;
    }
    if (setupStage === "pin") {
      firstPin = pin;
      setupStage = "confirm";
      $("setuptitle").textContent = "Confirm PIN";
      $("setupmsg").textContent = "Enter the same PIN again.";
      $("setupmsg").classList.remove("err");
      let confirmPad;
      confirmPad = buildPinPad($("setuppinpad"), $("setuppindots"), 6, pin2 => {
        if (pin2 !== firstPin) {
          $("setuptitle").textContent = "Set a PIN";
          $("setupmsg").textContent = "PINs did not match. Start over.";
          $("setupmsg").classList.add("err");
          confirmPad.shake();
          setTimeout(runSetup, 500);
          return;
        }
        // PIN confirmed: store hash, move to step 2.
        sha256hex(firstPin).then(h => {
          localStorage.setItem("lr_pin", h);
          firstPin = null;
          setupStage = "details";
          $("setupstep").textContent = "Step 2 of 2";
          $("setuptitle").textContent = "Connect your server";
          $("setupmsg").textContent = "Enter these once. They stay saved on this phone.";
          $("setupmsg").classList.remove("err");
          $("setuppinpad").style.display = "none";
          $("setuppindots").style.display = "none";
          $("setupform").style.display = "";
        });
      });
    }
  });
}

$("setupdone").onclick = () => {
  // Safety: PIN must be set before we accept server details.
  if (!localStorage.getItem("lr_pin")) {
    setupStage = "pin"; firstPin = null;
    runSetup();
    return;
  }
  const url = $("setup-url").value.trim().replace(/\/+$/, "");
  const key = $("setup-key").value.trim();
  if (!url || !key) {
    $("setupmsg").textContent = "Enter both the server URL and the API key.";
    $("setupmsg").classList.add("err");
    return;
  }
  localStorage.setItem("lr_url", url);
  localStorage.setItem("lr_key", key);
  enterApp();
};

// ---------- unlock ----------
const lockPad = buildPinPad($("pinpad"), $("pindots"), 6, async pin => {
  const h = await sha256hex(pin);
  if (h === localStorage.getItem("lr_pin")) {
    $("lockmsg").textContent = "Enter your PIN to unlock.";
    $("lockmsg").classList.remove("err");
    enterApp();
  } else {
    $("lockmsg").textContent = "Wrong PIN. Try again.";
    $("lockmsg").classList.add("err");
    lockPad.reset();
    lockPad.shake();
  }
});

// ---------- main app ----------
const urlEl = $("url"), keyEl = $("apikey"), cmdEl = $("cmd"),
      outEl = $("output"), hintEl = $("hint"),
      statusEl = $("status"), statusText = $("statustext");

function enterApp() {
  show("screen-app");
  urlEl.value = localStorage.getItem("lr_url") || "";
  keyEl.value = localStorage.getItem("lr_key") || "";
  if (urlEl.value) testConnection();
  cmdEl.focus();
}

$("gearbtn").onclick = () => $("settings").classList.toggle("open");
$("lockbtn").onclick = () => { show("screen-lock"); lockPad.reset(); };

urlEl.addEventListener("input", () => localStorage.setItem("lr_url", urlEl.value.trim()));
keyEl.addEventListener("input", () => localStorage.setItem("lr_key", keyEl.value.trim()));

function setStatus(state, text) {
  statusEl.className = state;
  statusText.textContent = text;
}
function baseUrl() {
  return (urlEl.value || "").trim().replace(/\/+$/, "");
}

async function testConnection() {
  const base = baseUrl();
  if (!base) { setStatus("bad", "no URL"); return; }
  setStatus("", "testing...");
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 10000);
    const r = await fetch(base + "/health", { method: "GET", signal: ctrl.signal });
    clearTimeout(t);
    if (r.ok) { setStatus("ok", "connected"); $("settings").classList.remove("open"); }
    else { setStatus("bad", "HTTP " + r.status); }
  } catch (e) { setStatus("bad", "unreachable"); }
}
$("testbtn").onclick = testConnection;

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function addEntry(command, stdout, stderr, exitCode) {
  const hint = $("hint");
  if (hint) hint.remove();
  const div = document.createElement("div");
  div.className = "entry";
  let html = '<div class="cmd">' + esc(command) + "</div>";
  if (stdout) html += '<div class="out">' + esc(stdout) + "</div>";
  if (stderr) html += '<div class="err">' + esc(stderr) + "</div>";
  const cls = exitCode === 0 ? "code" : "code bad";
  const mark = exitCode === 0 ? '<span class="okmark">&#10003;</span> ' : "";
  html += '<div class="' + cls + '">' + mark + "exit " + exitCode + "</div>";
  div.innerHTML = html;
  outEl.appendChild(div);
  outEl.scrollTop = outEl.scrollHeight;
}
function addError(command, msg) {
  const hint = $("hint");
  if (hint) hint.remove();
  const div = document.createElement("div");
  div.className = "entry";
  div.innerHTML = '<div class="cmd">' + esc(command) + '</div>' +
    '<div class="err">' + esc(msg) + "</div>";
  outEl.appendChild(div);
  outEl.scrollTop = outEl.scrollHeight;
}

// ---------- clear output ----------
$("clearbtn").onclick = () => {
  outEl.innerHTML = "";
  const hint = document.createElement("div");
  hint.className = "hint"; hint.id = "hint";
  hint.innerHTML = 'Run a command from below, or tap a shortcut.<br><br>' +
    '<span class="kbd">&uarr;</span><span class="kbd">&darr;</span> cycle through history';
  outEl.appendChild(hint);
};

// ---------- quick commands ----------
const QUICK = ["ls -la", "pwd", "whoami", "df -h", "uptime", "free -h"];
function buildQuick() {
  const bar = $("quickbar");
  bar.innerHTML = "";
  QUICK.forEach(c => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "quickcmd"; b.textContent = c;
    b.onclick = () => {
      cmdEl.value = c;
      runCommand();
    };
    bar.appendChild(b);
  });
}
buildQuick();

let history = [];
let histIdx = -1;
try { history = JSON.parse(localStorage.getItem("lr_hist") || "[]"); } catch (e) { history = []; }
function saveHistory() {
  try { localStorage.setItem("lr_hist", JSON.stringify(history.slice(-100))); } catch (e) {}
}

let running = false;
async function runCommand(forceCmd) {
  const command = (typeof forceCmd === "string" ? forceCmd : cmdEl.value).trim();
  if (!command || running) return;
  const base = baseUrl(), key = keyEl.value.trim();
  if (!base || !key) { addError(command, "Set the server URL and API key first."); return; }
  history.push(command); histIdx = history.length; saveHistory();
  cmdEl.value = "";
  running = true;
  const sendBtn = $("send");
  const origLabel = sendBtn.innerHTML;
  sendBtn.disabled = true;
  sendBtn.innerHTML = '<span class="spinner"></span>';
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 300000);
    const r = await fetch(base + "/exec", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-API-Key": key },
      body: JSON.stringify({ command }),
      signal: ctrl.signal
    });
    clearTimeout(t);
    if (r.status === 401) { addError(command, "Bad API key (401)."); setStatus("bad", "bad key"); return; }
    if (!r.ok) { addError(command, "Server error: HTTP " + r.status); return; }
    const data = await r.json();
    addEntry(command, data.stdout || "", data.stderr || "", data.exit_code);
    setStatus("ok", "connected");
  } catch (e) {
    const msg = e.name === "AbortError" ? "Request timed out." : "Request failed: " + (e.message || e);
    addError(command, msg);
    setStatus("bad", "unreachable");
  } finally {
    running = false;
    sendBtn.disabled = false;
    sendBtn.innerHTML = origLabel;
    cmdEl.focus();
  }
}

$("send").onclick = () => runCommand();
cmdEl.addEventListener("keydown", e => {
  if (e.key === "Enter") { runCommand(); }
  else if (e.key === "ArrowUp") {
    e.preventDefault();
    if (history.length && histIdx > 0) { histIdx--; cmdEl.value = history[histIdx]; }
  } else if (e.key === "ArrowDown") {
    e.preventDefault();
    if (histIdx < history.length - 1) { histIdx++; cmdEl.value = history[histIdx]; }
    else { histIdx = history.length; cmdEl.value = ""; }
  }
});

// ---------- boot ----------
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
if (!localStorage.getItem("lr_pin")) {
  runSetup();
} else {
  show("screen-lock");
}
</script>
</body>
</html>
