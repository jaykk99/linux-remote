<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Linux Remote</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Linux Remote">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  :root {
    --bg: #000000;
    --bg2: #0a0a0e;
    --surface: #16161b;
    --surface2: #1f1f26;
    --surface3: #2a2a33;
    --line: rgba(255, 255, 255, 0.09);
    --line-soft: rgba(255, 255, 255, 0.05);
    --text: #f5f5f7;
    --text2: rgba(245, 245, 247, 0.62);
    --text3: rgba(245, 245, 247, 0.32);
    --accent: #5b9bff;
    --accent-deep: #2f6fed;
    --accent-soft: rgba(91, 155, 255, 0.13);
    --accent-glow: rgba(91, 155, 255, 0.28);
    --green: #34d17b;
    --green-soft: rgba(52, 209, 123, 0.12);
    --red: #ff5c54;
    --red-soft: rgba(255, 92, 84, 0.12);
    --amber: #ffd60a;
    --radius: 18px;
    --radius-sm: 13px;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Inter, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    background:
      radial-gradient(140% 60% at 50% -10%, rgba(91, 155, 255, 0.09) 0%, transparent 55%),
      var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex; flex-direction: column; overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    position: relative;
  }

  /* ---------- screen transitions ---------- */
  .screen {
    display: flex; flex: 1; flex-direction: column; min-height: 0;
    opacity: 0; visibility: hidden; pointer-events: none;
    position: absolute; inset: 0;
    transition: opacity 0.28s cubic-bezier(0.32, 0.72, 0, 1), visibility 0.28s, transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
    transform: translateY(10px) scale(0.995);
  }
  .screen.active {
    opacity: 1; visibility: visible; pointer-events: auto;
    transform: translateY(0) scale(1);
  }

  /* ---------- lock / setup screens ---------- */
  #screen-lock, #screen-setup {
    align-items: center; justify-content: center;
    padding: 24px 28px calc(32px + env(safe-area-inset-bottom));
    gap: 14px; text-align: center;
  }
  .locklogo {
    width: 84px; height: 84px; border-radius: 26px;
    background: linear-gradient(150deg, var(--surface2), var(--surface));
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; font-weight: 700; color: var(--accent);
    font-family: var(--mono);
    box-shadow: 0 0 48px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    margin-bottom: 6px;
  }
  .locktitle { font-size: 24px; font-weight: 700; letter-spacing: -0.6px; }
  .locksub {
    color: var(--text2); font-size: 15px; line-height: 1.55;
    max-width: 300px; min-height: 46px; letter-spacing: -0.1px;
  }
  .locksub.err { color: var(--red); }

  /* ---------- PIN pad ---------- */
  .pindots { display: flex; gap: 16px; margin: 6px 0 14px; min-height: 16px; }
  .pindot {
    width: 13px; height: 13px; border-radius: 50%;
    border: 1.5px solid var(--text3); background: transparent;
    transition: all 0.18s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .pindot.filled {
    background: var(--accent); border-color: var(--accent);
    box-shadow: 0 0 14px var(--accent-glow);
    transform: scale(1.12);
  }
  .pinpad {
    display: grid; grid-template-columns: repeat(3, 82px); gap: 16px;
    justify-content: center;
  }
  .pinkey {
    width: 82px; height: 82px; border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--line-soft);
    color: var(--text); font-size: 28px; font-weight: 500; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-family: inherit; padding: 0; min-height: 0;
    transition: transform 0.12s ease, background 0.15s ease, box-shadow 0.2s ease;
  }
  .pinkey:active {
    background: var(--accent); border-color: transparent; color: #fff;
    transform: scale(0.9);
    box-shadow: 0 0 30px var(--accent-glow);
  }
  .pinkey.util { font-size: 15px; color: var(--text2); font-weight: 600; letter-spacing: 0.5px; }
  .pinkey.util:active { color: #fff; }
  .pinkey.ok { color: var(--accent); font-size: 26px; }
  .pinkey.ok:active { color: #fff; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-9px); }
    40%, 80% { transform: translateX(9px); }
  }
  .shake { animation: shake 0.42s ease; }

  /* ---------- setup form ---------- */
  .setupform { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 14px; }
  .setupform > div { text-align: left; }
  .setupform input {
    width: 100%; background: var(--surface); border: 1px solid var(--line);
    color: var(--text); border-radius: var(--radius-sm); padding: 15px 16px;
    font-size: 16px; font-family: var(--mono);
    transition: border-color 0.18s ease, box-shadow 0.18s ease;
  }
  .setupform input::placeholder { color: var(--text3); }
  .setupform input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }
  .setupform label {
    text-align: left; font-size: 13px; color: var(--text2); font-weight: 600;
    display: block; margin-bottom: 8px; letter-spacing: -0.1px;
  }
  .stepbadge {
    font-size: 11px; color: var(--accent); font-weight: 700;
    text-transform: uppercase; letter-spacing: 1.6px;
    background: var(--accent-soft); padding: 7px 16px; border-radius: 20px;
    border: 1px solid rgba(91, 155, 255, 0.22);
  }

  /* ---------- app topbar ---------- */
  #topbar {
    flex-shrink: 0; padding: 10px 16px;
    border-bottom: 1px solid var(--line-soft);
    background: rgba(0, 0, 0, 0.72);
    backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4);
    display: flex; align-items: center; gap: 10px;
    padding-top: calc(10px + env(safe-area-inset-top));
  }
  #topbar .apptitle {
    display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0;
  }
  #topbar .mini-logo {
    width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0;
    background: linear-gradient(150deg, var(--accent), var(--accent-deep));
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 14px; font-weight: 700; color: #fff;
    box-shadow: 0 2px 12px var(--accent-glow);
  }
  #topbar h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.4px; white-space: nowrap; }

  /* connection status pill */
  #status {
    font-size: 12.5px; font-weight: 600; color: var(--text2);
    display: flex; align-items: center; gap: 7px;
    background: var(--surface); border: 1px solid var(--line-soft);
    padding: 8px 13px; border-radius: 20px;
    transition: all 0.25s ease; white-space: nowrap; letter-spacing: -0.1px;
  }
  #status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text3); flex-shrink: 0; transition: background 0.25s ease; }
  #status.ok { color: var(--green); border-color: rgba(52, 209, 123, 0.28); background: var(--green-soft); }
  #status.ok .dot { background: var(--green); animation: pulse 2.2s ease-in-out infinite; }
  #status.bad { color: var(--red); border-color: rgba(255, 92, 84, 0.28); background: var(--red-soft); }
  #status.bad .dot { background: var(--red); }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(52, 209, 123, 0.45); }
    50% { box-shadow: 0 0 0 6px rgba(52, 209, 123, 0); }
  }
  #actbtn {
    background: var(--surface); border: 1px solid var(--line-soft); border-radius: 13px;
    color: var(--text2); font-size: 18px; width: 44px; height: 44px; min-height: 0;
    padding: 0; cursor: pointer; flex-shrink: 0;
    transition: all 0.15s ease;
    display: flex; align-items: center; justify-content: center;
  }
  #actbtn:active { transform: scale(0.9); color: var(--text); border-color: var(--line); }
  #gearbtn {
    background: var(--surface); border: 1px solid var(--line-soft); border-radius: 13px;
    color: var(--text2); font-size: 18px; width: 44px; height: 44px; min-height: 0;
    padding: 0; cursor: pointer; flex-shrink: 0;
    transition: all 0.15s ease;
    display: flex; align-items: center; justify-content: center;
  }
  #gearbtn:active { transform: scale(0.9); color: var(--text); border-color: var(--line); }

  /* ---------- settings panel ---------- */
  #settings {
    flex-shrink: 0; padding: 14px 16px; border-bottom: 1px solid var(--line-soft);
    background: var(--bg2); display: flex; flex-direction: column; gap: 10px;
    max-height: 0; overflow: hidden; padding-top: 0; padding-bottom: 0;
    border-bottom-width: 0;
    transition: max-height 0.3s cubic-bezier(0.32, 0.72, 0, 1), padding 0.3s cubic-bezier(0.32, 0.72, 0, 1);
  }
  #settings.open { max-height: 640px; padding-top: 14px; padding-bottom: 14px; border-bottom-width: 1px; }
  .fieldrow { display: flex; gap: 8px; }
  .fieldrow input {
    flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line);
    color: var(--text); border-radius: var(--radius-sm); padding: 13px 14px; font-size: 14px;
    font-family: var(--mono);
  }
  .fieldrow input::placeholder { color: var(--text3); }
  .fieldrow input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }
  .btnrow { display: flex; gap: 8px; }

  /* ---------- buttons ---------- */
  button {
    font-family: inherit; cursor: pointer; border-radius: var(--radius-sm);
    border: 1px solid var(--line); background: var(--surface2); color: var(--text);
    padding: 13px 18px; font-size: 15px; font-weight: 600; min-height: 50px;
    letter-spacing: -0.2px;
    transition: transform 0.12s ease, background 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
  }
  button:active { transform: scale(0.96); }
  button.primary {
    background: linear-gradient(160deg, var(--accent), var(--accent-deep));
    border-color: transparent; color: #fff; flex: 1;
    box-shadow: 0 6px 20px rgba(47, 111, 237, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.18);
  }
  button.primary:active { box-shadow: 0 2px 10px rgba(47, 111, 237, 0.3); }
  button.danger { border-color: rgba(255, 92, 84, 0.35); color: var(--red); background: transparent; }
  button.ghost { background: transparent; }

  /* ---------- output area ---------- */
  #outputwrap { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }
  #outputbar {
    flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 12px 18px 8px;
  }
  #outputbar .label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1.4px; color: var(--text3);
  }
  #clearbtn {
    background: var(--surface); border: 1px solid var(--line-soft);
    color: var(--text2); font-size: 12.5px; font-weight: 600;
    padding: 8px 15px; min-height: 0; border-radius: 10px; letter-spacing: -0.1px;
  }
  #clearbtn:active { color: var(--red); border-color: rgba(255, 92, 84, 0.4); }
  #output {
    flex: 1; overflow-y: auto; padding: 6px 16px 16px;
    font-family: var(--mono); font-size: 13px; line-height: 1.65;
    white-space: pre-wrap; word-break: break-word;
    -webkit-overflow-scrolling: touch;
  }
  .entry {
    margin-bottom: 10px; background: var(--surface);
    border: 1px solid var(--line-soft); border-radius: var(--radius);
    padding: 13px 15px; overflow: hidden;
    animation: rise 0.3s cubic-bezier(0.32, 0.72, 0, 1);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .entry .cmd { color: var(--accent); font-weight: 600; font-size: 13px; flex: 1; min-width: 0; }
  .entry .cmd::before { content: "$ "; color: var(--text3); font-weight: 400; }
  .entryhead { display: flex; align-items: center; gap: 8px; }
  .copybtn {
    flex-shrink: 0; background: var(--surface2); border: 1px solid var(--line-soft);
    color: var(--text2); font-size: 11.5px; font-weight: 600;
    padding: 6px 11px; min-height: 0; border-radius: 9px; letter-spacing: -0.1px;
  }
  .copybtn:active { color: var(--accent); border-color: var(--accent); }
  .entry .trunc {
    color: var(--amber); font-size: 11.5px; margin-top: 8px; font-weight: 600;
    font-family: var(--sans); letter-spacing: 0.2px;
  }
  .entry .out { color: rgba(245, 245, 247, 0.88); margin-top: 8px; }
  .entry .err { color: var(--red); margin-top: 8px; }
  .entry .code {
    color: var(--text3); font-size: 11px; margin-top: 10px;
    padding-top: 8px; border-top: 1px solid var(--line-soft);
    font-family: var(--sans); font-weight: 600; letter-spacing: 0.3px;
  }
  .entry .code.bad { color: var(--red); }
  .entry .code .okmark { color: var(--green); }
  .hint {
    color: var(--text3); font-size: 14px; text-align: center;
    margin-top: 48px; line-height: 2; font-family: var(--sans);
    padding: 0 24px; letter-spacing: -0.1px;
  }
  .hint .kbd {
    display: inline-block; background: var(--surface2); border: 1px solid var(--line);
    border-bottom-width: 2px; border-radius: 7px; padding: 2px 9px;
    font-family: var(--mono); font-size: 12px;
    color: var(--text2); margin: 0 3px;
  }

  /* ---------- quick commands ---------- */
  #quickbar {
    flex-shrink: 0; display: flex; gap: 8px; overflow-x: auto;
    padding: 4px 16px 12px;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  #quickbar::-webkit-scrollbar { display: none; }
  .quickwrap { flex-shrink: 0; display: flex; align-items: stretch; }
  .quickcmd {
    background: var(--surface); border: 1px solid var(--line-soft);
    color: var(--text2); font-family: var(--mono); font-size: 13px; font-weight: 500;
    padding: 10px 16px; min-height: 0; border-radius: 12px 0 0 12px; letter-spacing: -0.1px;
    transition: all 0.16s ease; border-right-width: 0;
  }
  .quickcmd:active {
    color: #fff; background: var(--accent-deep); border-color: transparent;
    transform: scale(0.94);
  }
  .quickrm {
    background: var(--surface); border: 1px solid var(--line-soft);
    color: var(--text3); font-size: 14px; font-weight: 600;
    padding: 10px 11px; min-height: 0; border-radius: 0 12px 12px 0;
  }
  .quickrm:active { color: var(--red); border-color: rgba(255, 92, 84, 0.4); }

  /* ---------- composer ---------- */
  #composer {
    flex-shrink: 0; padding: 8px 12px calc(12px + env(safe-area-inset-bottom));
    background: rgba(0, 0, 0, 0.72);
    backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4);
    display: flex; gap: 10px; align-items: center;
    border-top: 1px solid var(--line-soft);
  }
  #cmd {
    flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line);
    color: var(--text); border-radius: 22px; padding: 13px 18px; font-size: 16px;
    font-family: var(--mono); letter-spacing: -0.1px;
    transition: border-color 0.18s ease, box-shadow 0.18s ease;
  }
  #cmd::placeholder { color: var(--text3); font-family: var(--sans); }
  #cmd:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }
  #send {
    width: 50px; height: 50px; min-height: 0; min-width: 0; padding: 0;
    border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(160deg, var(--accent), var(--accent-deep));
    border: none; color: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(47, 111, 237, 0.4);
  }
  #send:active { transform: scale(0.88); }
  #send:disabled { opacity: 0.4; box-shadow: none; }
  #send svg { width: 20px; height: 20px; }
  #timeout {
    width: 60px; flex-shrink: 0; background: var(--surface); border: 1px solid var(--line);
    color: var(--text3); border-radius: 22px; padding: 13px 0; font-size: 14px;
    text-align: center; font-family: var(--mono);
  }
  #timeout::placeholder { color: var(--text3); }
  #timeout:focus { outline: none; border-color: var(--accent); color: var(--text); }
  #timeout::-webkit-outer-spin-button, #timeout::-webkit-inner-spin-button {
    -webkit-appearance: none; margin: 0;
  }
  #timeout { -moz-appearance: textfield; appearance: textfield; }
  .spinner {
    display: inline-block; width: 18px; height: 18px; flex-shrink: 0;
    border: 2.5px solid rgba(255, 255, 255, 0.3); border-top-color: #fff;
    border-radius: 50%; animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- activity overlay ---------- */
  #activity {
    position: absolute; inset: 0; z-index: 30;
    background: rgba(0, 0, 0, 0.96);
    display: flex; flex-direction: column;
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity 0.25s ease, visibility 0.25s;
    padding-top: calc(8px + env(safe-area-inset-top));
  }
  #activity.open { opacity: 1; visibility: visible; pointer-events: auto; }
  #acthead {
    flex-shrink: 0; display: flex; align-items: center;
    justify-content: space-between; padding: 12px 18px;
  }
  #acthead .label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1.4px; color: var(--text3);
  }
  #actlist {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 4px 16px calc(20px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 10px;
  }
  #actstats {
    flex-shrink: 0; display: flex; gap: 8px; overflow-x: auto;
    padding: 2px 16px 12px; scrollbar-width: none;
  }
  #actstats::-webkit-scrollbar { display: none; }
  .statcard {
    flex: 1 0 auto; min-width: 88px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px;
  }
  .statcard b { display: block; font-size: 15px; font-family: var(--mono); white-space: nowrap; }
  .statcard span {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text3);
  }
  .actcard {
    background: var(--surface); border: 1px solid var(--line-soft);
    border-radius: var(--radius-sm); padding: 12px 14px;
  }
  .actcard .acmd {
    font-family: var(--mono); font-size: 12.5px; color: var(--text);
    word-break: break-word; white-space: pre-wrap;
  }
  .actcard .acmd.blocked { color: var(--red); }
  .actcard .ameta {
    font-family: var(--sans); font-size: 11px; color: var(--text3);
    margin-top: 8px; display: flex; justify-content: space-between;
    align-items: center; gap: 8px;
  }
  .actcard .ameta .bad { color: var(--red); font-weight: 700; }
  .actcard .ameta .good { color: var(--green); font-weight: 700; }
  .arerun {
    background: var(--accent-soft); border: 1px solid rgba(91, 155, 255, 0.3);
    color: var(--accent); font-size: 12px; font-weight: 700;
    padding: 7px 12px; min-height: 0; border-radius: 9px; flex-shrink: 0;
  }
  .arerun:disabled { opacity: 0.35; }
  .arerun:active { transform: scale(0.94); }

  /* ---------- profile picker ---------- */
  .fieldrow select {
    flex: 1; min-width: 0; background: var(--surface);
    border: 1px solid var(--line); color: var(--text);
    border-radius: var(--radius-sm); padding: 13px 14px; font-size: 14px;
    font-family: var(--sans);
  }

</style>
</head>
<body>

<!-- PIN LOCK -->
<div class="screen" id="screen-lock">
  <div class="locklogo">&gt;_</div>
  <div class="locktitle">Linux Remote</div>
  <div class="locksub" id="lockmsg">Enter your PIN to unlock.</div>
  <div class="pindots" id="pindots"></div>
  <div class="pinpad" id="pinpad"></div>
</div>

<!-- FIRST-RUN SETUP -->
<div class="screen" id="screen-setup">
  <div class="locklogo">&gt;_</div>
  <div class="stepbadge" id="setupstep">Step 1 of 2</div>
  <div class="locktitle" id="setuptitle">Set a PIN</div>
  <div class="locksub" id="setupmsg">Enter a 4 to 6 digit PIN. Tap the checkmark when done with a 4 or 5 digit PIN.</div>
  <div class="pindots" id="setuppindots"></div>
  <div class="pinpad" id="setuppinpad"></div>
  <div class="setupform" id="setupform" style="display:none">
    <div>
      <label for="setup-url">Server URL</label>
      <input id="setup-url" type="url" placeholder="http://100.x.y.z:8000"
             autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <div>
      <label for="setup-key">API key</label>
      <input id="setup-key" type="password" placeholder="Paste the key from your server"
             autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <button class="primary" id="setupdone">Save and start</button>
  </div>
</div>

<!-- MAIN APP -->
<div class="screen" id="screen-app">
  <div id="topbar">
    <div class="apptitle">

    </div>

    <button id="actbtn" title="Recent activity" aria-label="Recent activity">&#8635;</button>
    <button id="gearbtn" title="Settings" aria-label="Settings">&#9881;</button>
  </div>

  <div id="settings">
    <div class="fieldrow">
      <select id="profile" aria-label="Server profile"></select>
      <button id="addprofile" class="ghost" style="flex-shrink:0; min-height:0;" title="Add server profile" aria-label="Add server profile">+</button>
      <button id="delprofile" class="ghost" style="flex-shrink:0; min-height:0;" title="Delete server profile" aria-label="Delete server profile">&minus;</button>

             autocomplete="off" autocapitalize="off" spellcheck="false">

             autocomplete="off" autocapitalize="off" spellcheck="false">

             autocomplete="off" autocapitalize="off" spellcheck="false">

             autocomplete="off" autocapitalize="off" spellcheck="false">

             autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">

    </div>

    </div>

      <button class="ghost" id="impbtn" style="flex:1;">Import profiles</button>

           autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send">
    <input id="timeout" type="number" min="1" inputmode="numeric" placeholder="&#9201;"
           title="Per-command timeout in seconds (blank = server default)"
           aria-label="Command timeout in seconds">
    <button id="send" aria-label="Run command"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg></button>
  </div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);

// ---------- crypto: SHA-256 hash of PIN, never stored raw ----------
async function sha256hex(text) {
  const buf = await crypto.subtle.digest("SHA-256",
    new TextEncoder().encode("lrpin:" + text));
  return Array.from(new Uint8Array(buf))
    .map(b => b.toString(16).padStart(2, "0")).join("");
}

// ---------- PIN pad builder ----------
// 4 to 6 digit PINs. The checkmark key submits a 4 or 5 digit PIN early;
// entering a 6th digit submits automatically.
function buildPinPad(padEl, dotsEl, maxLen, onComplete, onWrong) {
  let pin = "";
  const render = () => {
    dotsEl.innerHTML = "";
    for (let i = 0; i < maxLen; i++) {
      const d = document.createElement("div");
      d.className = "pindot" + (i < pin.length ? " filled" : "");
      dotsEl.appendChild(d);
    }
  };
  const submit = () => {
    if (pin.length < 4) { if (onWrong) onWrong(); return; }
    render();
    const done = pin; pin = "";
    setTimeout(() => { render(); onComplete(done); }, 120);
  };
  const keys = ["1","2","3","4","5","6","7","8","9","ok","0","bk"];
  padEl.innerHTML = "";
  keys.forEach(k => {
    const b = document.createElement("button");
    b.type = "button";
    if (k === "ok") {
      b.className = "pinkey util ok"; b.innerHTML = "&#10003;";
      b.setAttribute("aria-label", "Done");
      b.title = "Done";
    }
    else if (k === "bk") { b.className = "pinkey util"; b.innerHTML = "&#9003;"; }
    else { b.className = "pinkey"; b.textContent = k; }
    b.onclick = () => {
      if (k === "bk") { pin = pin.slice(0, -1); }
      else if (k === "ok") { submit(); return; }
      else if (pin.length < maxLen) {
        pin += k;
        if (pin.length === maxLen) { submit(); return; }
      }
      render();
    };
    padEl.appendChild(b);
  });
  render();
  return {
    reset() { pin = ""; render(); },
    shake() {
      padEl.classList.remove("shake");
      void padEl.offsetWidth;
      padEl.classList.add("shake");
    }
  };
}

// ---------- screens ----------
const screens = ["screen-lock", "screen-setup", "screen-app"];
function show(name) {
  screens.forEach(s => $(s).classList.toggle("active", s === name));
}

// ---------- setup flow ----------
let firstPin = null;
let setupStage = "pin"; // pin -> confirm -> details

function runSetup() {
  show("screen-setup");
  $("setupstep").textContent = "Step 1 of 2";
  $("setuptitle").textContent = "Set a PIN";
  $("setupmsg").textContent = "Enter a 4 to 6 digit PIN. Tap the checkmark when done with a 4 or 5 digit PIN.";
  $("setupmsg").classList.remove("err");
  $("setupform").style.display = "none";
  $("setuppinpad").style.display = "";
  $("setuppindots").style.display = "";
  setupStage = "pin";
  let setupPad;
  const tooShort = pad => {
    $("setupmsg").textContent = "PIN must be at least 4 digits. Try again.";
    $("setupmsg").classList.add("err");
    pad.shake();
  };
  setupPad = buildPinPad($("setuppinpad"), $("setuppindots"), 6, pin => {
    if (pin.length < 4) { tooShort(setupPad); return; } // backstop: submit() already enforces this
    if (setupStage === "pin") {
      firstPin = pin;
      setupStage = "confirm";
      $("setuptitle").textContent = "Confirm PIN";
      $("setupmsg").textContent = "Enter the same PIN again.";
      $("setupmsg").classList.remove("err");
      let confirmPad;
      confirmPad = buildPinPad($("setuppinpad"), $("setuppindots"), 6, pin2 => {
        if (pin2 !== firstPin) {
          $("setuptitle").textContent = "Set a PIN";
          $("setupmsg").textContent = "PINs did not match. Start over.";
          $("setupmsg").classList.add("err");
          confirmPad.shake();
          setTimeout(runSetup, 500);
          return;
        }
        // PIN confirmed: store hash, move to step 2.
        sha256hex(firstPin).then(h => {
          localStorage.setItem("lr_pin", h);
          firstPin = null;
          setupStage = "details";
          $("setupstep").textContent = "Step 2 of 2";
          $("setuptitle").textContent = "Connect your server";
          $("setupmsg").textContent = "Enter these once. They stay saved on this phone.";
          $("setupmsg").classList.remove("err");
          $("setuppinpad").style.display = "none";
          $("setuppindots").style.display = "none";
          $("setupform").style.display = "";
        });
      }, () => tooShort(confirmPad));
    }
  }, () => tooShort(setupPad));
}

$("setupdone").onclick = () => {
  // Safety: PIN must be set before we accept server details.
  if (!localStorage.getItem("lr_pin")) {
    setupStage = "pin"; firstPin = null;
    runSetup();
    return;
  }
  const url = $("setup-url").value.trim().replace(/\/+$/, "");
  const key = $("setup-key").value.trim();
  if (!url || !key) {
    $("setupmsg").textContent = "Enter both the server URL and the API key.";
    $("setupmsg").classList.add("err");
    return;
  }
  if (!/^https?:\/\//i.test(url)) {
    $("setupmsg").textContent = "URL must start with http:// or https://";
    $("setupmsg").classList.add("err");
    return;
  }
  // First server goes in as the default profile.
  localStorage.setItem("lr_profiles", JSON.stringify([
    { name: "Default", url, key, cwd: "" }
  ]));
  localStorage.setItem("lr_profile_idx", "0");
  localStorage.removeItem("lr_url");
  localStorage.removeItem("lr_key");
  enterApp();
};

// ---------- unlock ----------
// Brute-force guard: 8 wrong PINs in a row locks the pad for 60 seconds.
// A correct PIN resets the counter.
const PIN_MAX_FAIL = 8, PIN_LOCK_MS = 60000;
const lockPad = buildPinPad($("pinpad"), $("pindots"), 6, async pin => {
  const now = Date.now();
  const lockUntil = +(localStorage.getItem("lr_pin_lock") || 0);
  if (now < lockUntil) {
    $("lockmsg").textContent = "Too many wrong PINs. Wait " +
      Math.ceil((lockUntil - now) / 1000) + "s.";
    $("lockmsg").classList.add("err");
    lockPad.reset();
    lockPad.shake();
    return;
  }
  const h = await sha256hex(pin);
  if (h === localStorage.getItem("lr_pin")) {
    localStorage.removeItem("lr_pin_fail");
    localStorage.removeItem("lr_pin_lock");
    $("lockmsg").textContent = "Enter your PIN to unlock.";
    $("lockmsg").classList.remove("err");
    enterApp();
  } else {
    const fails = +(localStorage.getItem("lr_pin_fail") || 0) + 1;
    if (fails >= PIN_MAX_FAIL) {
      localStorage.setItem("lr_pin_lock", String(now + PIN_LOCK_MS));
      localStorage.removeItem("lr_pin_fail");
      $("lockmsg").textContent = "Too many wrong PINs. Locked for 60 seconds.";
    } else {
      localStorage.setItem("lr_pin_fail", String(fails));
      $("lockmsg").textContent = "Wrong PIN. Try again.";
    }
    $("lockmsg").classList.add("err");
    lockPad.reset();
    lockPad.shake();
  }
}, () => {
  $("lockmsg").textContent = "Enter at least 4 digits, then tap the checkmark.";
  $("lockmsg").classList.add("err");
  lockPad.shake();
});

// ---------- main app ----------
const urlEl = $("url"), keyEl = $("apikey"), cmdEl = $("cmd"), cwdEl = $("cwd"),
      outEl = $("output"), hintEl = $("hint"),
      statusEl = $("status"), statusText = $("statustext");

// ---------- server profiles ----------
// Multiple machines, one app. Migrates the old single lr_url/lr_key/lr_cwd
// keys into a "Default" profile on first run after the upgrade.
let profiles = [];
let activeProfile = 0;
function loadProfiles() {
  profiles = [];
  activeProfile = 0;
  try {
    const saved = JSON.parse(localStorage.getItem("lr_profiles") || "null");
    if (Array.isArray(saved) && saved.length) {
      profiles = saved.filter(p => p && typeof p === "object")
        .map(p => ({
          name: String(p.name || "Server"),
          url: String(p.url || ""),
          key: String(p.key || ""),
          cwd: String(p.cwd || "")
        }));
      activeProfile = Math.max(0, Math.min(
        +(localStorage.getItem("lr_profile_idx") || 0), profiles.length - 1));
      return;
    }
  } catch (e) {}
  const url = localStorage.getItem("lr_url") || "";
  const key = localStorage.getItem("lr_key") || "";
  const cwd = localStorage.getItem("lr_cwd") || "";
  profiles = [{ name: "Default", url, key, cwd }];
  saveProfiles();
}
function saveProfiles() {
  try {
    localStorage.setItem("lr_profiles", JSON.stringify(profiles));
    localStorage.setItem("lr_profile_idx", String(activeProfile));
  } catch (e) {}
}
function cur() {
  if (!profiles.length) profiles = [{ name: "Default", url: "", key: "", cwd: "" }];
  activeProfile = Math.max(0, Math.min(activeProfile, profiles.length - 1));
  return profiles[activeProfile];
}
function renderProfiles() {
  const sel = $("profile");
  sel.innerHTML = "";
  profiles.forEach((p, i) => {
    const o = document.createElement("option");
    o.value = String(i);
    o.textContent = p.name || ("Server " + (i + 1));
    sel.appendChild(o);
  });
  sel.value = String(activeProfile);
  const p = cur();
  $("pname").value = p.name;
  urlEl.value = p.url;
  keyEl.value = p.key;
  cwdEl.value = p.cwd;
}
$("profile").addEventListener("change", e => {
  activeProfile = +e.target.value || 0;
  saveProfiles();
  renderProfiles();
  setStatus("", "not tested");
});
$("addprofile").onclick = () => {
  profiles.push({ name: "Server " + (profiles.length + 1), url: "", key: "", cwd: "" });
  activeProfile = profiles.length - 1;
  saveProfiles();
  renderProfiles();
  $("settings").classList.add("open");
};
$("delprofile").onclick = () => {
  const p = cur();
  if (profiles.length <= 1) {
    profiles = [{ name: "Default", url: "", key: "", cwd: "" }];
  } else {
    if (!confirm("Delete profile \"" + p.name + "\"?")) return;
    profiles.splice(activeProfile, 1);
  }
  activeProfile = 0;
  saveProfiles();
  renderProfiles();
  setStatus("", "not tested");
};

function enterApp() {
  show("screen-app");
  loadProfiles();
  renderProfiles();
  if (baseUrl()) testConnection();
  cmdEl.focus();
}

$("gearbtn").onclick = () => $("settings").classList.toggle("open");
$("lockbtn").onclick = () => { show("screen-lock"); lockPad.reset(); };

function persistProfileField() {
  const p = cur();
  const newName = $("pname").value.trim();
  if (newName && newName !== p.name) {
    p.name = newName;
    const opt = $("profile").options[activeProfile];
    if (opt) opt.textContent = newName;
  }
  p.url = urlEl.value.trim();
  p.key = keyEl.value.trim();
  p.cwd = cwdEl.value.trim();
  saveProfiles();
}
$("pname").addEventListener("input", persistProfileField);
urlEl.addEventListener("input", persistProfileField);
keyEl.addEventListener("input", persistProfileField);
cwdEl.addEventListener("input", persistProfileField);

function setStatus(state, text) {
  statusEl.className = state;
  statusText.textContent = text;
}
function baseUrl() {
  return (urlEl.value || "").trim().replace(/\/+$/, "");
}

async function testConnection(quiet) {
  const base = baseUrl();
  if (!base) { if (!quiet) setStatus("bad", "no URL"); return; }
  if (!quiet) setStatus("", "testing...");
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 10000);
    const r = await fetch(base + "/health", { method: "GET", signal: ctrl.signal });
    clearTimeout(t);
    if (r.ok) {
      let host = "";
      try { host = (await r.json()).host || ""; } catch (e) {}
      setStatus("ok", "connected" + (host ? " · " + host : ""));
      if (!quiet) $("settings").classList.remove("open");
    }
    else { setStatus("bad", "HTTP " + r.status); }
  } catch (e) { setStatus("bad", "unreachable"); }
}
$("testbtn").onclick = () => testConnection(false);

// Re-check the connection every minute while the app is open so a dropped
// Tailscale link shows up in the status pill without a manual retest.
setInterval(() => {
  if ($("screen-app").classList.contains("active") && !running) testConnection(true);
}, 60000);

// ---------- rotate API key ----------
$("rotatebtn").onclick = async () => {
  const base = baseUrl(), key = keyEl.value.trim();
  if (!base || !key) { addError("", "Set the server URL and API key first."); return; }
  if (!confirm("Rotate the API key? The old key stops working immediately.")) return;
  try {
    const r = await fetch(base + "/rotate-key", {
      method: "POST",
      headers: { "X-API-Key": key }
    });
    if (r.status === 401) { addError("", "Bad API key (401)."); return; }
    if (!r.ok) { addError("", "Rotate failed: HTTP " + r.status); return; }
    const data = await r.json();
    keyEl.value = data.api_key || "";
    localStorage.setItem("lr_key", keyEl.value);
    addEntry("rotate-key", "API key rotated and saved on this phone.", "", 0, false);
    setStatus("ok", "connected");
  } catch (e) {
    addError("rotate-key", "Request failed: " + (e.message || e));
  }
};

// ---------- profile export / import ----------
// Exports all server profiles (name, url, key, cwd) as a JSON file so they
// can be moved to another phone. The file holds the API keys in plain
// text: keep it private, just like the keys themselves.
$("expbtn").onclick = () => {
  if (!profiles.length) { alert("No profiles to export."); return; }
  const payload = {
    app: "linux-remote", version: 1,
    exported: new Date().toISOString(), profiles: profiles,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)],
    { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "linux-remote-profiles.json";
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
};
$("impbtn").onclick = () => $("impfile").click();
$("impfile").addEventListener("change", () => {
  const f = $("impfile").files[0];
  $("impfile").value = "";
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    let added = 0, updated = 0, skipped = 0;
    try {
      const data = JSON.parse(rd.result);
      const list = Array.isArray(data) ? data : data.profiles;
      if (!Array.isArray(list)) throw new Error("not a profiles file");
      list.forEach(p => {
        if (!p || typeof p !== "object") { skipped++; return; }
        const name = String(p.name || "").trim();
        const url = String(p.url || "").trim().replace(/\/+$/, "");
        const key = String(p.key || "").trim();
        const cwd = String(p.cwd || "").trim();
        if (!name || !url || !key) { skipped++; return; }
        const entry = { name, url, key, cwd };
        const i = profiles.findIndex(x => x.name === name);
        if (i >= 0) { profiles[i] = entry; updated++; }
        else { profiles.push(entry); added++; }
      });
      if (added || updated) { saveProfiles(); renderProfiles(); }
      alert("Import done: " + added + " added, " + updated + " updated" +
        (skipped ? ", " + skipped + " skipped (invalid)" : "") + ".");
    } catch (e) {
      alert("Could not read that file: " + (e.message || e));
    }
  };
  rd.onerror = () => alert("Could not read that file.");
  rd.readAsText(f);
});

// ---------- recent activity (server audit log) ----------
$("actbtn").onclick = openActivity;
$("actclose").onclick = () => $("activity").classList.remove("open");

const ACT_RE = /^\[(.+?)\] ip=(\S+) cwd=(\S+) dur_ms=(\d+) exit=(\d+) cmd=(.*)$/;

function statCard(value, label) {
  const d = document.createElement("div");
  d.className = "statcard";
  const b = document.createElement("b");
  b.textContent = value;
  const s = document.createElement("span");
  s.textContent = label;
  d.appendChild(b);
  d.appendChild(s);
  return d;
}

// Summary analytics strip at the top of the activity view.
async function loadActStats() {
  const box = $("actstats");
  box.innerHTML = "";
  const base = baseUrl(), key = keyEl.value.trim();
  if (!base || !key) return;
  try {
    const r = await fetch(base + "/stats?n=500", { headers: { "X-API-Key": key } });
    if (!r.ok) return;
    const s = await r.json();
    if (!s || typeof s.total_commands !== "number") return;
    const rate = s.success_rate == null ? "n/a" : Math.round(s.success_rate * 100) + "%";
    const avg = s.avg_duration_ms == null ? "n/a" : Math.round(s.avg_duration_ms) + "ms";
    const top = (s.top_commands && s.top_commands[0])
      ? s.top_commands[0].command + " x" + s.top_commands[0].count : "n/a";
    const day = new Date().toISOString().slice(0, 10);
    const today = (s.per_day && s.per_day[day]) || 0;
    box.appendChild(statCard(String(s.total_commands), "commands"));
    box.appendChild(statCard(String(today), "today"));
    box.appendChild(statCard(rate, "success"));
    box.appendChild(statCard(avg, "avg time"));
    box.appendChild(statCard(String(s.blocked), "blocked"));
    box.appendChild(statCard(top, "top cmd"));
  } catch (e) { /* stats are best-effort; the list below still loads */ }
}

async function openActivity() {
  const ov = $("activity");
  ov.classList.add("open");
  loadActStats();
  const list = $("actlist");
  list.innerHTML = '<div class="hint" style="margin-top:24px;">Loading…</div>';
  const base = baseUrl(), key = keyEl.value.trim();
  if (!base || !key) {
    list.innerHTML = '<div class="hint" style="margin-top:24px;">Set the server URL and API key first.</div>';
    return;
  }
  try {
    const r = await fetch(base + "/recent?n=100", { headers: { "X-API-Key": key } });
    if (!r.ok) {
      list.innerHTML = '<div class="hint" style="margin-top:24px;">Failed: HTTP ' + r.status + '</div>';
      return;
    }
    const lines = (await r.json()).lines || [];
    if (!lines.length) {
      list.innerHTML = '<div class="hint" style="margin-top:24px;">No commands logged yet.</div>';
      return;
    }
    list.innerHTML = "";
    lines.forEach(ln => list.appendChild(activityCard(ln)));
  } catch (e) {
    list.innerHTML = '<div class="hint" style="margin-top:24px;">Request failed.</div>';
  }
}

function activityCard(line) {
  const card = document.createElement("div");
  card.className = "actcard";
  const cmd = document.createElement("div");
  cmd.className = "acmd";
  const meta = document.createElement("div");
  meta.className = "ameta";
  const m = line.match(ACT_RE);
  if (m) {
    const ts = m[1], dur = m[4], exit = +m[5], rawCmd = m[6];
    const blocked = rawCmd.indexOf("BLOCKED(") === 0;
    const shown = rawCmd.replace(/\\n/g, "\n");
    cmd.textContent = (blocked ? "" : "$ ") + shown;
    if (blocked) cmd.classList.add("blocked");
    const info = document.createElement("span");
    info.textContent = ts.replace("T", " ") + " · " + dur + "ms · ";
    const ex = document.createElement("b");
    ex.textContent = "exit " + exit;
    ex.className = exit === 0 ? "good" : "bad";
    info.appendChild(ex);
    const run = document.createElement("button");
    run.type = "button";
    run.className = "arerun";
    run.textContent = "↻ Run";
    run.title = "Run this command again";
    if (blocked) {
      run.disabled = true;
    } else {
      run.onclick = () => {
        $("activity").classList.remove("open");
        runCommand(shown);
      };
    }
    meta.appendChild(info);
    meta.appendChild(run);
  } else {
    cmd.textContent = line;
  }
  card.appendChild(cmd);
  card.appendChild(meta);
  return card;
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function copyText(text, btn) {
  const done = () => {
    const orig = btn.textContent;
    btn.textContent = "Copied";
    setTimeout(() => { btn.textContent = orig; }, 1200);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); done(); } catch (e) {}
  document.body.removeChild(ta);
}
// ---------- render cap ----------
// A command can legally return up to 1MB per stream; dumping all of it
// into the DOM makes the phone stutter. Show the first 100k chars and
// say so. The server already caps at LR_MAX_OUTPUT_BYTES separately.
const RENDER_CAP = 100000;
function capText(s) {
  if (s.length <= RENDER_CAP) return { text: s, capped: false };
  return { text: s.slice(0, RENDER_CAP), capped: true };
}
function addEntry(command, stdout, stderr, exitCode, truncated) {
  const hint = $("hint");
  if (hint) hint.remove();
  const div = document.createElement("div");
  div.className = "entry";
  const head = document.createElement("div");
  head.className = "entryhead";
  const cmdEl2 = document.createElement("div");
  cmdEl2.className = "cmd";
  cmdEl2.textContent = command;
  const copyBtn = document.createElement("button");
  copyBtn.type = "button"; copyBtn.className = "copybtn"; copyBtn.textContent = "Copy";
  copyBtn.onclick = () => copyText(
    "$ " + command + "\n" + (stdout || "") + (stderr || ""), copyBtn);
  head.appendChild(cmdEl2);
  head.appendChild(copyBtn);
  div.appendChild(head);
  if (stdout) {
    const o = document.createElement("div");
    o.className = "out";
    const cappedOut = capText(stdout);
    o.textContent = cappedOut.text;
    div.appendChild(o);
    if (cappedOut.capped) addDisplayCapNote(div);
  }
  if (stderr) {
    const e = document.createElement("div");
    e.className = "err";
    const cappedErr = capText(stderr);
    e.textContent = cappedErr.text;
    div.appendChild(e);
    if (cappedErr.capped) addDisplayCapNote(div);
  }
  if (truncated) {
    const t = document.createElement("div");
    t.className = "trunc";
    t.textContent = "Output was truncated by the server.";
    div.appendChild(t);
  }
  const code = document.createElement("div");
  code.className = exitCode === 0 ? "code" : "code bad";
  code.innerHTML = (exitCode === 0 ? '<span class="okmark">&#10003;</span> ' : "") +
    "exit " + exitCode;
  div.appendChild(code);
  outEl.appendChild(div);
  outEl.scrollTop = outEl.scrollHeight;
}
function addDisplayCapNote(div) {
  if (div.querySelector(".trunc.displaycap")) return;
  const t = document.createElement("div");
  t.className = "trunc displaycap";
  t.textContent = "Output shortened for display (first 100k chars shown).";
  div.appendChild(t);
}
function addError(command, msg) {
  const hint = $("hint");
  if (hint) hint.remove();
  const div = document.createElement("div");
  div.className = "entry";
  div.innerHTML = '<div class="cmd">' + esc(command) + '</div>' +
    '<div class="err">' + esc(msg) + "</div>";
  outEl.appendChild(div);
  outEl.scrollTop = outEl.scrollHeight;
}

// ---------- clear output ----------
$("clearbtn").onclick = () => {
  outEl.innerHTML = "";
  const hint = document.createElement("div");
  hint.className = "hint"; hint.id = "hint";
  hint.innerHTML = 'Run a command from below, or tap a shortcut.<br><br>' +
    '<span class="kbd">&uarr;</span><span class="kbd">&darr;</span> cycle through history';
  outEl.appendChild(hint);
};

// ---------- quick commands (editable, saved on the phone) ----------
const DEFAULT_QUICK = ["ls -la", "pwd", "whoami", "df -h", "uptime", "free -h"];
let quickCmds = DEFAULT_QUICK.slice();
try {
  const saved = JSON.parse(localStorage.getItem("lr_quick") || "null");
  if (Array.isArray(saved) && saved.length) quickCmds = saved.filter(c => typeof c === "string");
} catch (e) {}
function saveQuick() {
  try { localStorage.setItem("lr_quick", JSON.stringify(quickCmds)); } catch (e) {}
}
function buildQuick() {
  const bar = $("quickbar");
  bar.innerHTML = "";
  quickCmds.forEach(c => {
    const wrap = document.createElement("span");
    wrap.className = "quickwrap";
    const b = document.createElement("button");
    b.type = "button"; b.className = "quickcmd"; b.textContent = c;
    b.onclick = () => runCommand(c);
    const rm = document.createElement("button");
    rm.type = "button"; rm.className = "quickrm"; rm.textContent = "×";
    rm.title = "Remove shortcut"; rm.setAttribute("aria-label", "Remove " + c);
    rm.onclick = () => {
      quickCmds = quickCmds.filter(x => x !== c);
      if (!quickCmds.length) quickCmds = DEFAULT_QUICK.slice();
      saveQuick();
      buildQuick();
    };
    wrap.appendChild(b);
    wrap.appendChild(rm);
    bar.appendChild(wrap);
  });
}
buildQuick();
$("addquick").onclick = () => {
  const v = $("newquick").value.trim();
  if (!v) return;
  if (!quickCmds.includes(v)) { quickCmds.push(v); saveQuick(); buildQuick(); }
  $("newquick").value = "";
};

let history = [];
let histIdx = -1;
try { history = JSON.parse(localStorage.getItem("lr_hist") || "[]"); } catch (e) { history = []; }
function saveHistory() {
  try { localStorage.setItem("lr_hist", JSON.stringify(history.slice(-100))); } catch (e) {}
}

let running = false;
async function runCommand(forceCmd) {
  const command = (typeof forceCmd === "string" ? forceCmd : cmdEl.value).trim();
  if (!command || running) return;
  const base = baseUrl(), key = keyEl.value.trim();
  if (!base || !key) { addError(command, "Set the server URL and API key first."); return; }
  history.push(command); histIdx = history.length; saveHistory();
  cmdEl.value = "";
  running = true;
  const sendBtn = $("send");
  const origLabel = sendBtn.innerHTML;
  sendBtn.disabled = true;
  sendBtn.innerHTML = '<span class="spinner"></span>';
  // Optional per-command timeout (seconds); blank = server default. The
  // server clamps it to its configured ceiling, so this can only shorten.
  let timeoutS = null;
  const tv = $("timeout").value.trim();
  if (tv) {
    const n = parseInt(tv, 10);
    if (Number.isFinite(n) && n >= 1) timeoutS = n;
  }
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 300000);
    const r = await fetch(base + "/exec", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-API-Key": key },
      body: JSON.stringify({
        command, cwd: cwdEl.value.trim() || null, timeout_s: timeoutS
      }),
      signal: ctrl.signal
    });
    clearTimeout(t);
    if (!r.ok) {
      // Surface the server's own reason when it gives one (403 block
      // reason, 413 body limit, 429 lockout), so the message says what
      // actually happened instead of a generic code.
      let detail = null;
      try { detail = (await r.json()).detail || null; } catch (e) {}
      if (r.status === 401) { setStatus("bad", "bad key"); }
      addError(command, detail || ({
        400: "Bad request (400).",
        401: "Bad API key (401).",
        403: "Blocked by the server (403).",
        413: "Command too large for the server to accept (413).",
        429: "Too many failed attempts, locked out for a while (429).",
      }[r.status] || ("Server error: HTTP " + r.status)));
      return;
    }
    const data = await r.json();
    addEntry(command, data.stdout || "", data.stderr || "", data.exit_code, !!data.truncated);
    setStatus("ok", "connected");
  } catch (e) {
    const msg = e.name === "AbortError" ? "Request timed out." : "Request failed: " + (e.message || e);
    addError(command, msg);
    setStatus("bad", "unreachable");
  } finally {
    running = false;
    sendBtn.disabled = false;
    sendBtn.innerHTML = origLabel;
    cmdEl.focus();
  }
}

$("send").onclick = () => runCommand();
cmdEl.addEventListener("keydown", e => {
  if (e.key === "Enter") { runCommand(); }
  else if (e.key === "ArrowUp") {
    e.preventDefault();
    if (history.length && histIdx > 0) { histIdx--; cmdEl.value = history[histIdx]; }
  } else if (e.key === "ArrowDown") {
    e.preventDefault();
    if (histIdx < history.length - 1) { histIdx++; cmdEl.value = history[histIdx]; }
    else { histIdx = history.length; cmdEl.value = ""; }
  }
});

// ---------- boot ----------
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
if (!localStorage.getItem("lr_pin")) {
  runSetup();
} else {
  show("screen-lock");
}
</script>
</body>
</html>
